{{ define "header" }}
<!doctype html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
        <base target="_blank">

        <style>
            body {
                background-color: #F8F4F0;
                font-family: Georgia, 'Times New Roman', serif;
                font-size: 15px;
                line-height: 26px;
                margin: 0;
                color: #3A3430;
            }

            .wrap {
                background-color: #FFFFFF;
                padding: 30px;
                max-width: 525px;
                margin: 0 auto;
                border-radius: 5px;
            }

            .header {
                border-bottom: 1px solid #E8E0D8;
                padding-bottom: 15px;
                margin-bottom: 15px;
            }

            .footer {
                text-align: center;
                font-size: 12px;
                color: #9A938C;
            }
                .footer a {
                    color: #9A938C;
                }

            .gutter {
                padding: 30px;
            }
            .button {
                background: #C67D4A;
                color: #fff !important;
                display: inline-block;
                border-radius: 3px;
                padding: 10px 30px;
                text-align: center;
                text-decoration: none;
                font-weight: bold;
            }
            .button:hover {
                background: #B06A3A;
                color: #fff;
            }
            img {
                max-width: 100%;
            }

            a {
                color: #C67D4A;
            }
                a:hover {
                    color: #B06A3A;
                }
            @media screen and (max-width: 600px) {
                .wrap {
                    max-width: auto;
                }
                .gutter {
                    padding: 10px;
                }
            }
        </style>
    </head>
<body style="background-color: #F8F4F0;">
    <div class="gutter">&nbsp;</div>
    <div class="wrap">
        <div class="header">
            {{ if ne LogoURL "" }}
                <img src="{{ LogoURL }}" alt="Anuradha's Newsletter" />
            {{ end }}
        </div>
{{ end }}

{{ define "footer" }}
    </div>

    <div class="footer">
        <div style="border-top:1px solid #E8E0D8;padding-top:16px;margin-top:16px;max-width:525px;margin-left:auto;margin-right:auto;">
            <p style="font-size:13px;color:#9A938C;margin:0 0 8px 0;">
                Anuradha Weeraman &middot; CTO &amp; Co-Founder, Verdentra<br>
                <a href="https://weeraman.com" style="color:#C67D4A;">weeraman.com</a>
            </p>
        </div>
    </div>
    <div class="gutter">&nbsp;</div>
</body>
</html>
{{ end }}
